title: Rebuttal Letter
author: Issaku Kawashima
version: 0.0.1
contributes:
  formats:
    common:
      filters:
        - filter.lua
    pdf:
      documentclass: scrartcl
      include-in-header:
        text: |
          \usepackage[most]{tcolorbox}
          \newtcolorbox{reviewerbox}{
            enhanced, frame hidden, interior hidden, sharp corners,
            boxsep=0pt,
            left=20pt, right=10pt, top=5pt, bottom=5pt,  % 線とテキストの距離
            fontupper=\sffamily,                         % ゴシック体（サンセリフ）
            before skip=15pt, after skip=15pt,
            overlay={
              \draw[line width=4pt, black] (frame.north west) -- (frame.south west);
            }
          }
          \usepackage{longtable, booktabs, array}